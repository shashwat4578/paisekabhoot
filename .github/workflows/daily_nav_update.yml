name: Daily NAV Archiver & Performance Calculator

on:
  schedule:
    # 18:30 UTC = 12:00 AM IST next day
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  archive-and-calculate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run NAV Archiver
        run: python scripts/daily_nav_archiver.py
        
      - name: Run Performance Calculator
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/process_performance.py
        
      - name: Commit and Push Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nav_history/
          git commit -m "chore: auto-update NAV history & performance [skip ci]" || echo "No changes to commit"
          git push
